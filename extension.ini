name = format
owner = rhun-editor
title = Format
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/format-linux-x86_64
run.macos-arm64 = bin/format-macos-arm64
run.windows-x64 = bin/format-windows-x64.exe
on = command

[commands]
format_document = Format Document | ctrl+shift+i

[subscribe]
opened = *

[needs]
documents = write
project = read
run = gofmt rustfmt ruff black prettier clang-format shfmt zig nixfmt terraform sql-formatter dart swift-format ktfmt stylua rubocop mix ormolu fourmolu ocamlformat buf taplo
