name = format
owner = rhun-editor
title = Format
description = Formats the document with the formatter you already have, such as gofmt, prettier or ruff.
icon = icon.png
color = #c0508f
version = 0.3.0
protocol = 1
run.linux-x86_64 = bin/format-linux-x86_64
run.macos-arm64 = bin/format-macos-arm64
run.windows-x64 = bin/format-windows-x64.exe
on = command

[commands]
format_document = Format Document | ctrl+shift+i
# what a click on the status bar's error runs: the cursor to the line and column it names
goto_error = Go to the Format Error

# protocol 1.1: goto_error is only for the status item, not the palette
[command-options]
goto_error.palette = no

[subscribe]
opened = *

[needs]
documents = write
project = read
run = gofmt rustfmt ruff black prettier clang-format shfmt zig nixfmt terraform sql-formatter dart swift-format ktfmt stylua rubocop mix ormolu fourmolu ocamlformat buf taplo

# Format Document (shift+alt+f) asks it for these files, with the document's tab width and spaces;
# with protocol 1.1 (partial-format) Format Selection, and with [editor] format_on_type = yes
# typing } or Enter, ask it for part of them
[provides]
format = *.go *.rs *.py *.js *.mjs *.cjs *.jsx *.ts *.tsx *.css *.scss *.less *.html *.htm *.md *.yaml *.yml *.c *.h *.cc *.cpp *.cxx *.hpp *.hh *.sh *.bash *.zig *.nix *.tf *.hcl *.sql *.dart *.swift *.kt *.kts *.lua *.rb *.ex *.exs *.hs *.ml *.mli *.proto *.toml *.json *.jsonc *.json5
range_format = *.go *.rs *.py *.js *.mjs *.cjs *.jsx *.ts *.tsx *.css *.scss *.less *.html *.htm *.md *.yaml *.yml *.c *.h *.cc *.cpp *.cxx *.hpp *.hh *.sh *.bash *.zig *.nix *.tf *.hcl *.sql *.dart *.swift *.kt *.kts *.lua *.rb *.ex *.exs *.hs *.ml *.mli *.proto *.toml *.json *.jsonc *.json5
type_format = *.go *.rs *.py *.js *.mjs *.cjs *.jsx *.ts *.tsx *.css *.scss *.less *.html *.htm *.md *.yaml *.yml *.c *.h *.cc *.cpp *.cxx *.hpp *.hh *.sh *.bash *.zig *.nix *.tf *.hcl *.sql *.dart *.swift *.kt *.kts *.lua *.rb *.ex *.exs *.hs *.ml *.mli *.proto *.toml *.json *.jsonc *.json5
type_format.triggers = } newline
